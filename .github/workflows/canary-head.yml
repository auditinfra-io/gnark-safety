name: canary-head

# Scans gnark's master branch weekly against the latest classified snapshot,
# ignoring line numbers, so new gnark code that trips a rule is noticed
# before it ships in a release. A failure means a finding needs reading and
# classifying (see canary/README.md); it never blocks pull requests.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gnark-master:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Scan gnark std/ at master
        run: bash scripts/canary-gnark-std.sh master canary-master.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: canary-gnark-master
          path: canary-master.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Compare with the latest release snapshot
        run: |
          latest="$(printf '%s\n' canary/gnark-std-v*.json | sort -V | tail -n 1)"
          go run ./internal/canary/check -ignore-lines -snapshot "$latest" -report canary-master.json
