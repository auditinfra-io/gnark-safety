name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go: ["1.25.7", "stable"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Verify module cache
        run: go mod verify
      - run: go vet ./...
      # The analyzer suites type-check many fixture packages; under -race they
      # take several minutes, so the default 10-minute test timeout is too tight.
      - run: go test -count=1 -race -timeout 30m -coverprofile=coverage.out ./...

  analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -run '^$' -fuzz '^FuzzQuotientRemainderHint$' -fuzztime 30s ./examples/divmod

  action:
    # Runs the composite action from this checkout against the example:
    # a report-only pass must produce SARIF with the example's finding, and a
    # gated pass must fail the step. Upload is disabled because pull requests
    # from forks and private repositories may lack code scanning.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report-only scan
        id: report
        uses: ./
        with:
          path: ./examples/divmod
          include-examples: "true"
          fail-on: none
          upload-sarif: "false"
      - name: Gated scan
        id: gate
        continue-on-error: true
        uses: ./
        with:
          path: ./examples/divmod
          include-examples: "true"
          upload-sarif: "false"
      - name: Check action outcomes
        env:
          REPORT_EXIT: ${{ steps.report.outputs.exit-code }}
          REPORT_SARIF: ${{ steps.report.outputs.sarif-file }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          GATE_EXIT: ${{ steps.gate.outputs.exit-code }}
        run: |
          set -euo pipefail
          test "$REPORT_EXIT" = 0
          test "$GATE_OUTCOME" = failure
          test "$GATE_EXIT" = 1
          python3 - "$REPORT_SARIF" <<'PY'
          import json, sys
          results = json.load(open(sys.argv[1]))["runs"][0]["results"]
          assert len(results) == 1, results
          assert results[0]["level"] == "error", results[0]
          uri = results[0]["locations"][0]["physicalLocation"]["artifactLocation"]["uri"]
          assert uri == "examples/divmod/circuits.go", uri
          PY

  canary:
    # Scans gnark's std/ at pinned releases and requires every finding to be
    # classified in canary/ (see canary/README.md).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        gnark: ["v0.15.0", "v0.16.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Scan gnark std/
        env:
          GNARK_VERSION: ${{ matrix.gnark }}
        run: bash scripts/canary-gnark-std.sh "$GNARK_VERSION" canary-report.json
      - name: Compare with the classified snapshot
        env:
          GNARK_VERSION: ${{ matrix.gnark }}
        run: go run ./internal/canary/check -snapshot "canary/gnark-std-${GNARK_VERSION}.json" -report canary-report.json
