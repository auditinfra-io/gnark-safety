name: release-evidence

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@c0137caad775660c0844396c52da96e560aba63d # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Run tests and retain output
        run: |
          mkdir -p dist/release-evidence
          set -o pipefail
          go test -count=1 -v ./... | tee dist/release-evidence/test-output.txt
      - name: Generate evidence
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" go run -ldflags "-X github.com/auditinfra-io/gnark-safety/internal/version.override=${GITHUB_REF_NAME}" ./cmd/release-evidence --output dist/release-evidence
          cd dist/release-evidence
          sha256sum analysis.sarif sbom.spdx.json source-hashes.json test-output.txt toolchain.json > SHA256SUMS
          tar --sort=name --mtime="@0" --owner=0 --group=0 --numeric-owner -czf ../gnark-safety-release-evidence.tar.gz .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence
          path: dist/gnark-safety-release-evidence.tar.gz
          if-no-files-found: error
      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/gnark-safety-release-evidence.tar.gz --clobber
