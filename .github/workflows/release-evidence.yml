name: release-evidence

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Release preflight
        run: bash scripts/release-preflight.sh "${GITHUB_REF_NAME}"
      - name: Verify modules
        run: go mod verify
      - name: Run tests and retain output
        run: |
          mkdir -p dist/release-evidence
          set -o pipefail
          go test -count=1 -v ./... | tee dist/release-evidence/test-output.txt
      - name: Build release binaries
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" bash scripts/build-release.sh "${GITHUB_REF_NAME}" dist/binaries
          cp dist/binaries/gnark-safety-binaries.sha256 dist/release-evidence/
      - name: Generate evidence
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" go run -ldflags "-X github.com/auditinfra-io/gnark-safety/internal/version.override=${GITHUB_REF_NAME}" ./cmd/release-evidence --output dist/release-evidence
          cd dist/release-evidence
          sha256sum analysis.sarif gnark-safety-binaries.sha256 sbom.spdx.json source-hashes.json test-output.txt toolchain.json > SHA256SUMS
          tar --sort=name --mtime="@0" --owner=0 --group=0 --numeric-owner -czf ../gnark-safety-release-evidence.tar.gz .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: |
            dist/gnark-safety-release-evidence.tar.gz
            dist/binaries/
          if-no-files-found: error
      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/gnark-safety-release-evidence.tar.gz dist/binaries/* --clobber
